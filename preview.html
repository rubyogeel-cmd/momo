<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momo preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0f19;
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #1e2438;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8a91a4;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #1e2438;
      background: transparent;
      color: #cbd5e1;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab:hover {
      border-color: #2f3a55;
    }
    .tab[aria-selected="true"] {
      background: #1e5af6;
      border-color: #1e5af6;
      color: #ffffff;
    }
    .stage {
      flex: 1 1 auto;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
      min-height: 0;
    }
    .phone {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: flex;
    }
    .phone iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f5f5f7;
      display: block;
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <h1>Momo preview</h1>
      <nav class="tabs" role="tablist" aria-label="Preview pages">
        <button class="tab" role="tab" data-src="web/index.html"
                aria-selected="true">Status</button>
        <button class="tab" role="tab" data-src="web/plans.html"
                aria-selected="false">Plans</button>
        <button class="tab" role="tab"
                data-src="web/checkout.html?plan=premium"
                aria-selected="false">Checkout</button>
        <button class="tab" role="tab"
                data-src="web/sms.html?plan=premium&amp;phone=079764645"
                aria-selected="false">SMS</button>
      </nav>
    </header>
    <div class="stage">
      <div class="phone">
        <iframe id="frame" src="web/index.html" title="Momo preview"></iframe>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tabs = document.querySelectorAll(".tab");
      var frame = document.getElementById("frame");
      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          tabs.forEach(function (other) {
            other.setAttribute("aria-selected", "false");
          });
          tab.setAttribute("aria-selected", "true");
          frame.src = tab.dataset.src;
        });
      });
    })();
  </script>
</body>
</html>
