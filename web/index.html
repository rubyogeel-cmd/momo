<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Status — Starlink Zambia</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="app-shell">

    <!-- Top bar ------------------------------------------------------ -->
    <header class="app-top-bar">
      <img class="app-top-bar__brand" src="assets/img/logo.png" alt="Starlink">
    </header>

    <!-- Content ------------------------------------------------------ -->
    <main class="app-content">

      <!-- Choose package CTA -->
      <a class="btn btn--primary" href="plans.html">
        <svg class="btn__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Choose your package</span>
      </a>

      <!-- Service info card -->
      <section class="service-card" aria-labelledby="service-title">
        <span class="service-card__accent" aria-hidden="true"></span>
        <p class="service-card__eyebrow">Service Information</p>
        <h2 class="service-card__title" id="service-title">Starlink Zambia</h2>
        <p class="service-card__subtitle">
          Select a plan to activate high-speed satellite internet.
        </p>
      </section>

      <!-- Metrics grid -->
      <section class="metric-grid" aria-label="Connection metrics">
        <article class="metric-tile">
          <header class="metric-tile__head">
            <span class="metric-tile__label">Download</span>
            <svg class="metric-tile__arrow metric-tile__arrow--down"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M12 4v16"/>
              <path d="m6 14 6 6 6-6"/>
            </svg>
          </header>
          <p class="metric-tile__value">170.10</p>
          <p class="metric-tile__unit">Mbps</p>
        </article>

        <article class="metric-tile">
          <header class="metric-tile__head">
            <span class="metric-tile__label">Upload</span>
            <svg class="metric-tile__arrow metric-tile__arrow--up"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M12 20V4"/>
              <path d="m18 10-6-6-6 6"/>
            </svg>
          </header>
          <p class="metric-tile__value">26.41</p>
          <p class="metric-tile__unit">Mbps</p>
        </article>

        <article class="metric-tile">
          <header class="metric-tile__head">
            <span class="metric-tile__label">Ping</span>
          </header>
          <p class="metric-tile__value">57</p>
          <p class="metric-tile__unit">ms</p>
        </article>

        <article class="metric-tile">
          <header class="metric-tile__head">
            <span class="metric-tile__label">Jitter</span>
          </header>
          <p class="metric-tile__value">5</p>
          <p class="metric-tile__unit">ms</p>
        </article>
      </section>

      <!-- Data usage -->
      <section class="card" aria-labelledby="usage-title">
        <header class="usage-card__head">
          <h3 class="usage-card__title" id="usage-title">
            <svg class="usage-card__title-icon" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
              <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
            </svg>
            <span>Data Usage</span>
          </h3>
          <span class="pill">43%</span>
        </header>

        <div class="progress" role="progressbar" aria-valuenow="43"
             aria-valuemin="0" aria-valuemax="100"
             style="margin-top: var(--space-4);">
          <div class="progress__fill" style="width: 43%;"></div>
        </div>

        <footer class="usage-card__footer">
          <span>43.3 GB</span>
          <span>100 GB</span>
        </footer>
      </section>

      <!-- Diagnostic -->
      <button type="button" class="btn btn--outline">
        <svg class="btn__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 22h16"/>
          <path d="m10 2 6 12h-8l6 8" transform="translate(-2,0)"/>
        </svg>
        <span>Run Diagnostic Test</span>
      </button>

    </main>

    <!-- Bottom nav --------------------------------------------------- -->
    <nav class="app-bottom-nav" aria-label="Primary">
      <a class="app-nav-item" href="index.html" aria-current="page">
        <svg class="app-nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.55a11 11 0 0 1 14 0"/>
          <path d="M8.5 16.03a6 6 0 0 1 7 0"/>
          <path d="M2 8.82a15 15 0 0 1 20 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
        <span>Status</span>
      </a>
      <a class="app-nav-item" href="plans.html">
        <svg class="app-nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Plans</span>
      </a>
      <a class="app-nav-item" href="#orders">
        <svg class="app-nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Orders</span>
      </a>
      <a class="app-nav-item" href="#settings">
        <svg class="app-nav-item__icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>

  </div>
</body>
</html>
